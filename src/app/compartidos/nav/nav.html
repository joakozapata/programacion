<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="nav.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fas fa-rocket me-2"></i>
                Overflow
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link active px-3" routerLink='/inicio' routerLinkAactive="active">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" routerLink='/productos' routerLinkAactive="active">productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" routerLink='/ofertas' routerLinkAactive="active">Ofertas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" routerLink='/contacto'>Contacto</a>
                    </li>
                    <li>
                        <form class="d-flex" role="search">
                            <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                            <button class="btn btn-outline-success" type="submit">Search</button>
                        </form>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a class="btn btn-outline-light btn-sm px-4 py-2 fw-semibold" routerLink='/carrito' routerLinkAactive="active">
                            carrito
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>


</body>

</html>
